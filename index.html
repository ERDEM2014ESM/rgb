<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino RGB Led Kontrol</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            margin-top: 30px;
        }
        h2 { color: #0078d4; margin-bottom: 25px; text-align: center; }

        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        button {
            font-size: 14px;
            padding: 8px 24px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            color: white;
            background-color: #0078d4;
        }
        button:hover { background-color: #005a9e; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        
        span { font-size: 14px; }

        .color-picker-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
        }
        #colorPicker {
            width: 200px;
            height: 200px;
            border: none;
            cursor: pointer;
            background: none;
        }
        h3 { margin-top: 0; text-align: center; color: #444; }

        /* Sağ Alt Köşedeki Bilgi Butonu */
        .info-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #555;
            padding: 10px 16px;
            border-radius: 50px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            font-size: 13px;
            z-index: 1000;
        }
        .info-button:hover {
            background-color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Arduino RGB Led Kontrol</h2>
        
        <!-- BAĞLANTI AYARLARI -->
        <div class="card controls">
            <button id="connectBtn">Bağlan</button>
            <span id="status" style="font-weight: bold; color: gray;">• Bağlı Değil</span>
        </div>

        <!-- RENK SEÇİCİ -->
        <div class="card">
            <h3></h3>
            <div class="color-picker-wrapper">
                <input type="color" id="colorPicker" value="#0000ff" disabled>
            </div>
        </div>
    </div>

    <!-- SAĞ ALT KÖŞEDEKİ AÇIKLAMA BUTONU -->
    <button class="info-button" onclick="window.open('aciklama.html', '_blank')">Arduino Kodu</button>

    <script>
        let port;
        let reader;
        let keepReading = true;
        const FIXED_BAUD_RATE = 115200;

        const connectBtn = document.getElementById('connectBtn');
        const statusSpan = document.getElementById('status');
        const colorPicker = document.getElementById('colorPicker');

        if (!('serial' in navigator)) {
            alert('Tarayıcınız Web Serial API desteklemiyor. Lütfen güncel Chrome, Edge veya Opera kullanın.');
            connectBtn.disabled = true;
        }

        // Arka Planda Seri Portu Dinleme
        async function readFromPort() {
            const textDecoder = new TextDecoderStream();
            const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
            reader = textDecoder.readable.getReader();

            try {
                while (keepReading) {
                    const { value, done } = await reader.read();
                    if (done) break;
                }
            } catch (error) {
                console.error('Okuma hatası:', error);
                handleDisconnect();
            } finally {
                reader.releaseLock();
                await readableStreamClosed.catch(() => {});
            }
        }

        // Bağlanma İşlemi
        connectBtn.addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: FIXED_BAUD_RATE });
                
                statusSpan.textContent = "• Bağlandı";
                statusSpan.style.color = "green";
                
                connectBtn.disabled = true;
                colorPicker.disabled = false;
                
                keepReading = true;
                readFromPort();

                port.addEventListener('disconnect', handleDisconnect);

            } catch (error) {
                console.error(error);
                alert('Bağlantı başarısız: ' + error.message);
            }
        });

        // Bağlantı Koptuğunda Arayüzü Sıfırla
        function handleDisconnect() {
            keepReading = false;
            statusSpan.textContent = "• Bağlı Değil";
            statusSpan.style.color = "gray";
            connectBtn.disabled = false;
            colorPicker.disabled = true;
        }

        // Veri Gönderme Fonksiyonu
        async function sendRawData(text) {
            if (!port || !port.writable) return;
            const encoder = new TextEncoder();
            const writer = port.writable.getWriter();
            await writer.write(encoder.encode(text));
            writer.releaseLock();
        }

        // RENK SEÇİCİ TETİKLEYİCİSİ (Anlık B,G,R Gönderimi)
        colorPicker.addEventListener('input', async (e) => {
            const hex = e.target.value;
            
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);

            const stringData = `${b},${g},${r}\n`;
            await sendRawData(stringData);
        });
    </script>
</body>
</html>
